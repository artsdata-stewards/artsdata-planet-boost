name: Process Organization Batch

on:
  workflow_dispatch:
    inputs:
      batch_content:
        required: true
        type: string
        description: 'Base64-encoded JSON batch data'
      register_only:
        required: false
        type: boolean
        description: 'Only register dataset and not load it'
        default: false
      metadata_artifact:
        required: false
        description: 'Artifact name for metadata'
        default: 'metadata_wikidata_spider.jsonld'

      metadata_file_name:
        description: 'Filename for combined metadata'
        required: false
        default: 'metadata_wikidata_spider.jsonld'

jobs:
  load_json:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Decode batch content
        run: |
          echo "${{ github.event.inputs.batch_content }}" | base64 -d > batch.json
          echo "Decoded batch.json:"
          cat batch.json

      - id: load
        run: |
          echo "Loading Base64 batch content into matrix"
          MATRIX=$(jq -c . batch.json)
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

  run_matrix:
    needs: load_json
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJson(needs.load_json.outputs.matrix) }}

    steps:
      - name: Crawl and push using pipeline-action
        uses: culturecreates/artsdata-pipeline-action@v3
        with:
          mode: 'fetch-push'
          artifact: '${{ matrix.org.artifact }}'
          page-url: '${{ matrix.org.url }}'
          token: "${{ secrets.GITHUB_TOKEN }}"
          publisher: "http://kg.artsdata.ca/resource/K1-202"
          register-only: '${{ inputs.register_only }}'
          custom-databus-url: "http://staging.api.artsdata.ca/databus/"
          metadata-config: |
            {
              "file_name": "${{ matrix.org.file_name }}",
              "datafeed_uri": "${{ matrix.org.datafeed_uri }}",
              "datafeed_title": "${{ matrix.org.datafeed_title }}",
              "datafeed_name": "${{ matrix.org.name }}",
              "datafeed_url": "${{ matrix.org.url }}",
              "same_as": "${{ matrix.org.same_as }}",
              "metadata_artifact": "${{ matrix.org.metadata_artifact }}",
              "crawl_name": "${{ matrix.org.crawl_name }}",
              "crawl_description": "${{ matrix.org.crawl_description }}",
              "artsdata_uri": "${{ matrix.org.artsdata_uri }}",
              "skip_crawl": "${{ matrix.org.skip_crawl }}"
            }

  combine_metadata:
    needs: run_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Combine metadata files
        shell: bash
        run: |
          ARTIFACT=$(jq -r '.[0].artifact' batch.json)
          CHILD_FILE=$(jq -r '.[0].child_file_name' batch.json)

          REGEX="${CHILD_FILE%%$ARTIFACT*}"

          FILE_NAME="metadata/${{ inputs.metadata_file_name }}"

          echo "Running combine_metadata with:"
          echo "  regex: $REGEX"
          echo "  file_name: $FILE_NAME"

          bundle exec ruby src/combine_metadata.rb "$REGEX" "$FILE_NAME"

      - name: Commit combined metadata
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Combine metadata for batch"
          git push

      - name: Push metadata to artsdata
        uses: culturecreates/artsdata-pipeline-action@v3
        with:
          mode: 'push'
          artifact: '${{ inputs.metadata_artifact }}'
          token: "${{ secrets.GITHUB_TOKEN }}"
          publisher: "http://kg.artsdata.ca/resource/K1-202"
          downloadUrl: "https://raw.githubusercontent.com/${{ github.repository }}/main/metadata/${{ inputs.metadata_file_name }}"
          custom-databus-url: "http://staging.api.artsdata.ca/databus/"
